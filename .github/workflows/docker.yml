name: Docker Image

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}
  DOCKERHUB_IMAGE_REPOSITORY: yansongda/php
  ALIYUN_IMAGE_TOKEN: ${{ secrets.ALIYUN_IMAGE_ACCESSTOKEN }}
  ALIYUN_IMAGE_REPOSITORY: registry.cn-shenzhen.aliyuncs.com/yansongda/php

jobs:
  build:
    name: Image ${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
        php-mode:
          - cli
          - zts
        system:
          - alpine
          - trixie
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Recognize tag
        run: |
          platform=${{ matrix.platform }}
          tag=${platform#linux/}-${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
          ghcr_image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_ENV"
      - name: Build the docker image
        run: |
          docker buildx ls
          # Attestations (provenance/sbom) are disabled on purpose: with them a
          # single-platform `docker push` publishes an OCI index (the image plus
          # an unknown/unknown attestation manifest) instead of a plain manifest.
          # The per-arch tags must stay plain manifests so that the index job can
          # merge them with `docker buildx imagetools create` (legacy
          # `docker manifest create` refuses manifest lists as sources).
          docker buildx build \
            --provenance=false --sbom=false \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            -t app --platform ${{ matrix.platform }} \
            -f ./docker/${{ matrix.php-mode }}/${{ matrix.system }}/Dockerfile .
      - name: Smoke test
        run: |
          docker run --rm app sh -ec '
            if php -v 2>&1 | grep -q "Failed loading"; then
              echo "PHP startup warning detected:"
              php -v 2>&1 | grep "Failed loading"
              exit 1
            fi
            php -m | grep -Eiq "^(swoole|redis|xlswriter)$"
            composer --version >/dev/null
            pie --version >/dev/null
            # Swoole replaces the native CurlHandle object handlers; destroying a
            # handle it does not own must not segfault (swoole-src#6145, fixed in
            # 6.2.3). Also guards --enable-swoole-curl on the ZTS builds.
            php -r "\$h = curl_init(); \$arr = [\$h, 42]; unset(\$h, \$arr); gc_collect_cycles(); echo \"curl dtor ok\n\";"
            d=$(php -n -r "echo ini_get(\"extension_dir\");")
            found=0
            for so in "$d"/*.so; do
              [ -e "$so" ] || continue
              found=1
              # musl (alpine) ldd always reports Error relocating ... symbol not found
              # for PHP core symbols (resolved at dlopen time); only a missing
              # shared library (musl: Error loading shared library, glibc:
              # = not found) is a real packaging bug.
              if ldd "$so" 2>&1 | grep -Eq "Error loading shared library|=> not found"; then
                echo "MISSING shared libs in $so:"
                ldd "$so" 2>&1 | grep -E "Error loading shared library|=> not found"
                exit 1
              fi
            done
            [ "$found" = 1 ] || { echo "no shared extensions found in $d"; exit 1; }
            echo "smoke test ok"
          '
      - name: Push the image to all registries (concurrent, with retry)
        run: |
          push_retry() {
            for i in 1 2 3; do
              docker push "$1" && return 0
              [ "$i" -eq 3 ] && return 1
              echo "push $1 failed (attempt $i), retry in 10s"
              sleep 10
            done
          }

          echo "$GITHUB_TOKEN" | docker login ghcr.io --username=${{ github.actor }} --password-stdin
          echo "$ALIYUN_IMAGE_TOKEN" | docker login --username=yansongda registry.cn-shenzhen.aliyuncs.com --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login --username yansongda --password-stdin

          docker tag app "$ghcr_image:$tag"
          docker tag app "$ALIYUN_IMAGE_REPOSITORY:$tag"
          docker tag app "$DOCKERHUB_IMAGE_REPOSITORY:$tag"

          push_retry "$ghcr_image:$tag" & P1=$!
          push_retry "$ALIYUN_IMAGE_REPOSITORY:$tag" & P2=$!
          push_retry "$DOCKERHUB_IMAGE_REPOSITORY:$tag" & P3=$!

          FAIL=0
          wait $P1 || FAIL=1
          wait $P2 || FAIL=1
          wait $P3 || FAIL=1

          docker logout ghcr.io || true
          docker logout registry.cn-shenzhen.aliyuncs.com || true
          docker logout || true
          exit $FAIL

  index:
    name: Index ${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
        php-mode:
          - cli
          - zts
        system:
          - alpine
          - trixie
    env:
      PLATFORMS: "linux/arm64 linux/amd64"
      EXPECTED_PLATFORMS: "linux/amd64,linux/arm64"
    steps:
      - name: Recognize tag
        run: |
          tag=${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
          ghcr_image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_ENV"
      - name: Create and verify the indexes in all registries (with retry)
        run: |
          list=$(echo $PLATFORMS | sed 's/linux\///g')

          refs_aliyun=''
          refs_hub=''
          refs_ghcr=''
          for platform in $list;
          do
            refs_aliyun="$refs_aliyun$ALIYUN_IMAGE_REPOSITORY:$platform-$tag "
            refs_hub="$refs_hub$DOCKERHUB_IMAGE_REPOSITORY:$platform-$tag "
            refs_ghcr="$refs_ghcr$ghcr_image:$platform-$tag "
          done

          # `buildx imagetools create` replaces the target tag instead of amending
          # a locally cached list, so it is idempotent and safe to retry. It also
          # accepts manifest lists as sources, unlike legacy `docker manifest
          # create`, and needs no local docker manifest store.
          index_retry() {
            for i in 1 2 3; do
              docker buildx imagetools create -t "$1" $2 && return 0
              [ "$i" -eq 3 ] && return 1
              echo "index $1 failed (attempt $i), retry in 15s"
              sleep 15
            done
          }

          # Fail loudly if an index ever carries anything but amd64+arm64
          # (e.g. an unknown/unknown provenance attestation caused by a builder
          # change), instead of silently publishing a broken multi-arch tag.
          verify_index() {
            got=$(docker buildx imagetools inspect --raw "$1" \
              | jq -r '[.manifests[].platform | "\(.os)/\(.architecture)"] | sort | join(",")')
            if [ "$got" != "$EXPECTED_PLATFORMS" ]; then
              echo "unexpected platforms in $1: '$got' (want '$EXPECTED_PLATFORMS')"
              return 1
            fi
            echo "$1: $got"
          }

          echo "$GITHUB_TOKEN" | docker login ghcr.io --username=${{ github.actor }} --password-stdin
          echo "$ALIYUN_IMAGE_TOKEN" | docker login --username=yansongda registry.cn-shenzhen.aliyuncs.com --password-stdin
          echo "$DOCKERHUB_TOKEN" | docker login --username yansongda --password-stdin

          FAIL=0
          index_retry "$ALIYUN_IMAGE_REPOSITORY:$tag" "$refs_aliyun" \
            && verify_index "$ALIYUN_IMAGE_REPOSITORY:$tag" || FAIL=1
          index_retry "$DOCKERHUB_IMAGE_REPOSITORY:$tag" "$refs_hub" \
            && verify_index "$DOCKERHUB_IMAGE_REPOSITORY:$tag" || FAIL=1
          index_retry "$ghcr_image:$tag" "$refs_ghcr" \
            && verify_index "$ghcr_image:$tag" || FAIL=1

          docker logout ghcr.io || true
          docker logout registry.cn-shenzhen.aliyuncs.com || true
          docker logout || true
          exit $FAIL
