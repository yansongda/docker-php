name: Docker Image

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_ACCESSTOKEN }}
  DOCKERHUB_IMAGE_REPOSITORY: yansongda/php
  ALIYUN_IMAGE_TOKEN: ${{ secrets.ALIYUN_IMAGE_ACCESSTOKEN }}
  ALIYUN_IMAGE_REPOSITORY: registry.cn-shenzhen.aliyuncs.com/yansongda/php

jobs:
  build:
    name: Image ${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
        php-mode:
          - cli
          - zts
        system:
          - alpine
          - trixie
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Recognize tag
        run: |
          platform=${{ matrix.platform }}
          tag=${platform#linux/}-${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
          ghcr_image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_ENV"
      - name: Build the docker image
        run: |
          docker buildx ls
          docker buildx build \
            --build-arg PHP_VERSION=${{ matrix.php-version }} \
            -t app --platform ${{ matrix.platform }} \
            -f ./docker/${{ matrix.php-mode }}/${{ matrix.system }}/Dockerfile .
      - name: Smoke test
        run: |
          docker run --rm app sh -c 'php -v && php -m | grep -Ei "swoole|redis|xlswriter|opcache" && composer --version && pie --version'
          ext_dir=$(docker run --rm app php -r 'echo ini_get("extension_dir");')
          docker run --rm app sh -c "ldd $ext_dir/*.so | grep -q 'not found' && { ldd $ext_dir/*.so | grep 'not found'; exit 1; } || echo 'all extension libs ok'"
      - name: Push the image to GHCR (with retry)
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username=${{ github.actor }} --password-stdin
          docker tag app "$ghcr_image:$tag"
          for i in 1 2 3; do
            docker push "$ghcr_image:$tag" && break
            [ "$i" -eq 3 ] && exit 1
            echo "push failed (attempt $i), retry in 10s"
            sleep 10
          done
          docker logout

  push:
    name: Push ${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}-${{ matrix.platform }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
        php-mode:
          - cli
          - zts
        system:
          - alpine
          - trixie
        platform:
          - linux/amd64
          - linux/arm64
    steps:
      - name: Recognize tag
        run: |
          platform=${{ matrix.platform }}
          tag=${platform#linux/}-${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
          ghcr_image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_ENV"
      - name: Copy the image to Aliyun & Docker Hub (concurrent, with retry)
        run: |
          sudo apt-get install -y skopeo > /dev/null

          copy_retry() {
            for i in 1 2 3; do
              skopeo copy --retry-times 3 "$@" && return 0
              [ "$i" -eq 3 ] && return 1
              echo "copy to $2 failed (attempt $i), retry in 15s"
              sleep 15
            done
          }

          copy_retry "docker://$ghcr_image:$tag" "docker://$ALIYUN_IMAGE_REPOSITORY:$tag" \
            --src-creds "${{ github.actor }}:$GITHUB_TOKEN" \
            --dest-creds "yansongda:$ALIYUN_IMAGE_TOKEN" & P1=$!
          copy_retry "docker://$ghcr_image:$tag" "docker://$DOCKERHUB_IMAGE_REPOSITORY:$tag" \
            --src-creds "${{ github.actor }}:$GITHUB_TOKEN" \
            --dest-creds "yansongda:$DOCKERHUB_TOKEN" & P2=$!

          FAIL=0
          wait $P1 || FAIL=1
          wait $P2 || FAIL=1
          exit $FAIL

  manifest:
    name: Manifest ${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
      - push
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.5'
          - '8.4'
          - '8.3'
          - '8.2'
        php-mode:
          - cli
          - zts
        system:
          - alpine
          - trixie
    env:
      PLATFORMS: "linux/arm64 linux/amd64"
    steps:
      - name: Recognize manifest
        run: |
          tag=${{ matrix.php-mode }}-${{ matrix.php-version }}-${{ matrix.system }}
          ghcr_image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')

          echo "$tag"
          echo "tag=$tag" >> "$GITHUB_ENV"
          echo "ghcr_image=$ghcr_image" >> "$GITHUB_ENV"
      - name: Push the manifests to all registries (with retry)
        run: |
          list=$(echo $PLATFORMS | sed 's/linux\///g')

          refs_aliyun=''
          refs_hub=''
          refs_ghcr=''
          for platform in $list;
          do
            refs_aliyun="$refs_aliyun$ALIYUN_IMAGE_REPOSITORY:$platform-$tag "
            refs_hub="$refs_hub$DOCKERHUB_IMAGE_REPOSITORY:$platform-$tag "
            refs_ghcr="$refs_ghcr$ghcr_image:$platform-$tag "
          done

          manifest_retry() {
            for i in 1 2 3; do
              docker manifest create "$1" $2 && docker manifest push "$1" && return 0
              [ "$i" -eq 3 ] && return 1
              echo "manifest $1 failed (attempt $i), retry in 15s"
              sleep 15
            done
          }

          echo "$ALIYUN_IMAGE_TOKEN" | docker login --username=yansongda registry.cn-shenzhen.aliyuncs.com --password-stdin
          manifest_retry "$ALIYUN_IMAGE_REPOSITORY:$tag" "$refs_aliyun"
          docker logout

          echo "$DOCKERHUB_TOKEN" | docker login --username yansongda --password-stdin
          manifest_retry "$DOCKERHUB_IMAGE_REPOSITORY:$tag" "$refs_hub"
          docker logout

          echo "$GITHUB_TOKEN" | docker login ghcr.io --username=${{ github.actor }} ghcr.io --password-stdin
          manifest_retry "$ghcr_image:$tag" "$refs_ghcr"
          docker logout
